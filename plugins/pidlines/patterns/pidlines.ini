; pidlines pattern settings (UTF-8). The section is the pattern file name
; without "pid_" and ".dxf": pid_pneumatic.dxf -> [pneumatic].
;   label = name shown in the plugin's list (quote it; no commas)
;   gap   = length of line cut out under each symbol, mm at symbol scale 1
;           (0 = the line runs through the symbol; keep it under 20)
;   line  = 0 for patterns drawn without the line (the line is deleted)
;   mirror_steep = 1: on lines steeper than 45° the symbol is mirrored across
;           the line, so the symbol reads the same way on every run (// stays
;           //, L stays L instead of a backwards L). Not for text patterns.
;   upright_vertical = 1: on vertical runs (within 1°) the symbol is not
;           turned at all, it looks exactly as on a horizontal run.
;   gap_vertical = gap on vertical runs, mm at symbol scale 1 (default = gap)
; A pidlines.ini in Documents\LibreCAD\pidlines overrides these per key.

[pneumatic]
label="สัญญาณลม (pneumatic)  —//—"
; drawn over the line, the line is not cut (ISA line-type table, 2026-10-20)
gap=0
mirror_steep=1

[undefined]
label="สัญญาณไม่ระบุชนิด (undefined)  —/—"
; drawn over the line, the line is not cut
gap=0
mirror_steep=1

[hydraulic]
label="สัญญาณไฮดรอลิก (hydraulic)  —L—"
; drawn over the line, the line is not cut (ISA line-type table, 2026-10-20)
gap=0
mirror_steep=1
; vertical runs: the L stays upright, its foot crosses the line
upright_vertical=1

[capillary]
label="ท่อ capillary  —X—"
; drawn over the line, the line is not cut (ISA line-type table, 2026-10-20)
gap=0

[datalink]
label="ลิงก์ข้อมูล ภายในระบบ (data link)  —o—"
; white dot: the line stops a little outside the circle (0.5 mm each side at scale 1)
gap=2.5

[datalink_ext]
label="ลิงก์ข้อมูล ระหว่างระบบอิสระ (DCS/PLC/PC)  —●—"
; black dot: drawn over the line, not cut
gap=0

[mechanical]
label="ลิงก์ทางกล (mechanical)  —◉—"
gap=1.5

[em_guided]
label="คลื่นแม่เหล็กไฟฟ้า/เสียง มีตัวนำ (guided)  —∿—"
; drawn over the line, the line is not cut (ISA line-type table, 2026-10-20)
gap=0

[em_unguided]
label="คลื่นแม่เหล็กไฟฟ้า/เสียง ไม่มีตัวนำ (unguided)  ∿ ∿ ไม่มีเส้น"
line=0

[cws]
label="น้ำหล่อเย็น จ่าย (cooling water supply)  —CWS—"
gap=7.75
spacing=40

[cwr]
label="น้ำหล่อเย็น กลับ (cooling water return)  —CWR—"
gap=7.889
spacing=40

[hws]
label="น้ำร้อน จ่าย (hot water supply)  —HWS—"
gap=8.028
spacing=40

[hwr]
label="น้ำร้อน กลับ (hot water return)  —HWR—"
gap=8.167
spacing=40
