; pidlines pattern settings (UTF-8). The section is the pattern file name
; without "pid_" and ".dxf": pid_pneumatic.dxf -> [pneumatic].
;   label = name shown in the plugin's list (quote it; no commas)
;   gap   = length of line cut out under each symbol, mm at symbol scale 1
;           (0 = the line runs through the symbol; keep it under 20)
;   line  = 0 for patterns drawn without the line (the line is deleted)
; A pidlines.ini in Documents\LibreCAD\pidlines overrides these per key.

[pneumatic]
label="สัญญาณลม (pneumatic)  —//—"
gap=1.5

[hydraulic]
label="สัญญาณไฮดรอลิก (hydraulic)  —L—"
gap=1.2

[capillary]
label="ท่อ capillary  —X—"
gap=2.0

[datalink]
label="ลิงก์ข้อมูล / software (data link)  —o—"
gap=1.5

[mechanical]
label="ลิงก์ทางกล (mechanical)  —●—"
gap=1.5

[em_guided]
label="คลื่นแม่เหล็กไฟฟ้า/เสียง มีตัวนำ (guided)  —∿—"
gap=3.0

[em_unguided]
label="คลื่นแม่เหล็กไฟฟ้า/เสียง ไม่มีตัวนำ (unguided)  ∿∿ ไม่มีเส้น"
line=0
